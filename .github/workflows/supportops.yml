name: SupportOps verification
on:
  push:
    paths: ['supportops-ai/**', '.github/workflows/supportops.yml']
  pull_request:
    paths: ['supportops-ai/**', '.github/workflows/supportops.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supportops-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: supportops-ai/backend/pom.xml
      - run: docker info
      - run: mvn -B -ntp -f backend/pom.xml verify
      - name: Require real integration tests
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('backend/target/surefire-reports/TEST-io.supportops.PlatformIntegrationTest.xml').getroot()
          assert int(root.attrib['tests']) >= 9
          assert int(root.attrib.get('skipped', '0')) == 0, 'Integration tests must not be skipped in CI'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-reports
          path: supportops-ai/backend/target/surefire-reports/
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supportops-ai/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g pnpm@11.19.0
      - run: pnpm install --ignore-workspace --frozen-lockfile --ignore-scripts
      - run: pnpm typecheck
      - run: pnpm build
