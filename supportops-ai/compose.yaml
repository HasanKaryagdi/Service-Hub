name: supportops-ai
x-api-env: &api-env
  DATABASE_URL: jdbc:postgresql://postgres:5432/supportops
  DATABASE_USER: supportops
  DATABASE_PASSWORD: ${DATABASE_PASSWORD:-local-app-password}
  READONLY_PASSWORD: ${READONLY_PASSWORD:-local-reader-password}
  REDIS_HOST: redis
  KAFKA_BOOTSTRAP: kafka:9092
  OTEL_ENDPOINT: http://otel-collector:4318/v1/traces
  TRACING_ENABLED: ${TRACING_ENABLED:-false}
  JWT_SECRET: ${JWT_SECRET:-local-only-secret-change-me-at-least-32-bytes-long}
  DEMO_PASSWORD: ${DEMO_PASSWORD:-SupportOps-local-2026!}
  SIMULATOR_TOKEN: ${SIMULATOR_TOKEN:-local-simulator-secret}
x-mock: &mock
  image: supportops-api:local
  pull_policy: never
  profiles: [simulation]
  depends_on:
    api: {condition: service_healthy}
  restart: unless-stopped
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: supportops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-bootstrap-password}
      APP_PASSWORD: ${DATABASE_PASSWORD:-local-app-password}
      READER_PASSWORD: ${READONLY_PASSWORD:-local-reader-password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d supportops"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7.4.6-alpine
    command: [redis-server, --appendonly, "yes"]
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes: [kafka-data:/var/lib/kafka/data]
    healthcheck:
      test: [CMD-SHELL, "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
  api:
    build: ./backend
    image: supportops-api:local
    environment:
      <<: *api-env
      OLLAMA_URL: ${OLLAMA_URL:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      kafka: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, "bash -c 'exec 3<>/dev/tcp/localhost/8080; printf \"GET /actuator/health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3; cat <&3' | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 20
  frontend:
    build: ./frontend
    environment:
      API_URL: http://api:8080
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      api: {condition: service_healthy}
  payment-service:
    <<: *mock
    environment:
      <<: *api-env
      SIMULATOR_ENABLED: "true"
      SIMULATOR_ROLE: payment
      SERVICE_NAME: payment-service
      SEED_ENABLED: "false"
    ports: ["127.0.0.1:8081:8080"]
  wallet-service:
    <<: *mock
    environment:
      <<: *api-env
      SIMULATOR_ENABLED: "true"
      SIMULATOR_ROLE: wallet
      SERVICE_NAME: wallet-service
      SEED_ENABLED: "false"
  transaction-service:
    <<: *mock
    environment:
      <<: *api-env
      SIMULATOR_ENABLED: "true"
      SIMULATOR_ROLE: transaction
      SERVICE_NAME: transaction-service
      SEED_ENABLED: "false"
  rebate-service:
    <<: *mock
    environment:
      <<: *api-env
      SIMULATOR_ENABLED: "true"
      SIMULATOR_ROLE: rebate
      SERVICE_NAME: rebate-service
      SEED_ENABLED: "false"
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.135.0
    profiles: [observability]
    command: [--config=/etc/otelcol/config.yaml]
    volumes: [./infra/otel.yaml:/etc/otelcol/config.yaml:ro]
  tempo:
    image: grafana/tempo:2.8.2
    profiles: [observability]
    command: [-config.file=/etc/tempo.yaml]
    volumes: [./infra/tempo.yaml:/etc/tempo.yaml:ro]
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [observability]
    volumes: [./infra/prometheus.yaml:/etc/prometheus/prometheus.yml:ro]
    ports: ["127.0.0.1:9090:9090"]
  grafana:
    image: grafana/grafana:12.1.1
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-local-grafana-password}
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:3001:3000"]
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.4
    profiles: [search]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes: [elastic-data:/usr/share/elasticsearch/data]
volumes:
  postgres-data:
  redis-data:
  kafka-data:
  elastic-data:
